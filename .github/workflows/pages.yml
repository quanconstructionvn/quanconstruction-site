# Người tạo: Quang Mai Phú
name: SEO build and Pages deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Người chỉnh sửa: Quang Mai Phú – kiểm tra cấu hình Pages trước khi xuất bản.
      - name: Check GitHub Pages configuration
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Test CMS and sitemap
        run: python -m unittest discover -s tests -v
      - name: Build static website
        run: python _cong-cu/build_site.py --output _site
      - name: Validate published SEO
        run: python _cong-cu/check_seo_build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Người chỉnh sửa: Quang Mai Phú – giải phóng lượt Pages cũ bị kẹt khi chuyển nguồn.
      - name: Clear blocked migration deployment
        uses: actions/github-script@v7
        with:
          script: |
            const args = {...context.repo, pages_deployment_id: '1621f86799f1c7c171a1db092a2275b3ea1697fa'};
            let state;
            try {
              state = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', args);
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            core.info('Migration deployment status: ' + state.data.status);
            const active = ['queued', 'pending', 'deployment_in_progress', 'syncing_files', 'updating_pages', 'waiting', 'canceling'];
            if (active.includes(state.data.status) || state.data.status === 'deployment_cancelled') {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', args);
              for (let attempt = 0; attempt < 12; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', args);
                core.info('Migration deployment status: ' + result.data.status);
                if (!active.includes(result.data.status)) return;
              }
              core.setFailed('Old Pages deployment has not released its lock after cancellation.');
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
