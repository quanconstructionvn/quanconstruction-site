# Người tạo: Quang Mai Phú
name: SEO build and Pages deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Người chỉnh sửa: Quang Mai Phú – mỗi ngày 00:05 giờ Việt Nam tự đăng bài hẹn ngày.
  schedule:
    - cron: '5 17 * * *'

permissions:
  contents: read

concurrency:
  group: seo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Người chỉnh sửa: Quang Mai Phú – kiểm tra cấu hình Pages trước khi xuất bản.
      - name: Check GitHub Pages configuration
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      # Người chỉnh sửa: Quang Mai Phú – tạo trang bài viết theo lịch đăng (bài chưa tới ngày không xuất bản).
      - name: Build scheduled articles
        run: |
          python _cong-cu/tao-bai-viet.py
          python _cong-cu/tao-trang-phap-ly.py
      - name: Test CMS and sitemap
        run: python -m unittest discover -s tests -v
      - name: Build static website
        run: python _cong-cu/build_site.py --output _site
      - name: Validate published SEO
        run: python _cong-cu/check_seo_build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
