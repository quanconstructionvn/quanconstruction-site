# Người tạo: Quang Mai Phú
# Người chỉnh sửa: Quang Mai Phú – đổi lịch kiểm tra sang hằng ngày
name: Daily SEO and indexing audit
on:
  # 01:00 UTC = 08:00 mỗi ngày, giờ Việt Nam. GitHub có thể xếp hàng trễ.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-audit.yml'
      - '_cong-cu/seo_audit.py'
      - '_cong-cu/seo-requirements.txt'
      - 'tests/test_seo_audit.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seo-audit.yml'
      - '_cong-cu/seo_audit.py'
      - '_cong-cu/seo-requirements.txt'
      - 'tests/test_seo_audit.py'

permissions:
  contents: read

concurrency:
  group: seo-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audit logic
        run: python -m unittest discover -s tests -v
      - name: Install Google read-only API client
        if: github.event_name != 'pull_request'
        run: python -m pip install -r _cong-cu/seo-requirements.txt
      - name: Audit live sitemap and Google index status
        if: github.event_name != 'pull_request'
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GSC_PROPERTY: https://quanconstruction.biz.vn/
        run: python _cong-cu/seo_audit.py --limit 200 --output _seo_reports
      - name: Save SEO reports
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: _seo_reports/
          if-no-files-found: warn
          retention-days: 30
